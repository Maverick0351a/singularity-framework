[workspace]
members = [
    "crates/substrate-override",
    "crates/silicon-trace",
    "crates/liquid-core",
    "crates/darwin-evolver",
    "crates/singularity-engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Travis Johnson <travis@peoplemach.com>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
rand = "0.8"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
